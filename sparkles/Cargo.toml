[package]
name = "sparkles"
description = "Capture execution flow of your Rust application with CPU cycle precision!"
version = "0.1.7"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/skibon02/sparkles"
readme = "../README.md"

[dependencies]
sparkles-core = {version = "0.1.4", path = "../sparkles-core"}
sparkles-macro = {version = "0.1.4", path = "../sparkles-macro"}
bincode = "2.0.0-rc.3"
log = { version = "0.4.26", default-features = false }
ringbuf = "0.4.7"
thread-id = { version = "5.0.0" }
chrono = "0.4.39"
parking_lot = "0.12.3"
if-addrs = "0.13.3"
rand = "0.9.0"

[dev-dependencies]
# for examples
simple_logger = "5.0.0"
# for puffin tests
puffin_http = "0.16.1"
puffin = { version = "0.19.0" }


[features]
default = ["self-tracing"]
accurate-timestamps-x86 = ["sparkles-core/accurate-timestamps-x86"]
self-tracing = ["sparkles-core/self-tracing"]
