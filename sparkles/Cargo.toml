[package]
name = "sparkles"
description = "Capture execution flow of your Rust application with CPU cycle precision!"
version = "0.1.5"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/skibon02/sparkles"
readme = "../README.md"

[dependencies]
sparkles-core = {version = "0.1.4", path = "../sparkles-core"}
bincode = "2.0.0-rc.3"
log = { version = "0.4.26", default-features = false }
ringbuf = "0.4.7"
drop_guard = "0.3.0"
thread-id = { version = "5.0.0" }
chrono = "0.4.39"

[dev-dependencies]
# for examples
simple_logger = "5.0.0"
# for puffin tests
puffin_http = "0.16.1"
puffin = { version = "0.19.0" }
tracing = "0.1.40"
tracing-perfetto = "0.1.5"
tracing-subscriber = "0.3.19"
anyhow = "1.0.96"

sparkles-macro = {path = "../sparkles-macro"}

[features]
default = ["self-tracing"]
accurate-timestamps-x86 = ["sparkles-core/accurate-timestamps-x86"]
self-tracing = []
