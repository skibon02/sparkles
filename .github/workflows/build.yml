name: Sparkles Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Test sparkles library for all supported platforms and feature combinations
  cross-platform-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Host platform (x86_64)
          - target: x86_64-unknown-linux-gnu
            features: ""
            rust: stable
          - target: x86_64-unknown-linux-gnu
            features: "force-fallback-impl"
            rust: stable
          - target: x86_64-unknown-linux-gnu
            features: "udp-streaming"
            rust: stable
          
          # RISC-V 32-bit (requires nightly for build-std)
          - target: riscv32imac-esp-espidf
            features: ""
            rust: nightly
          - target: riscv32imac-esp-espidf
            features: "force-fallback-impl"
            rust: nightly
          - target: riscv32imac-esp-espidf
            features: "udp-streaming"
            rust: nightly
          
          # AArch64
          - target: aarch64-unknown-linux-gnu
            features: ""
            rust: stable
          - target: aarch64-unknown-linux-gnu
            features: "force-fallback-impl"
            rust: stable
          - target: aarch64-unknown-linux-gnu
            features: "udp-streaming"
            rust: stable

    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust toolchain (non-RISC-V)
        if: matrix.target != 'riscv32imac-esp-espidf'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          targets: ${{ matrix.target }}
          components: rust-src
      
      - name: Install Rust toolchain (RISC-V)
        if: matrix.target == 'riscv32imac-esp-espidf'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rust-src
      
      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      
      - name: Build sparkles for ${{ matrix.target }}
        run: |
          if [[ "${{ matrix.target }}" == "riscv32imac-esp-espidf" ]]; then
            # RISC-V requires build-std on nightly
            if [[ -n "${{ matrix.features }}" ]]; then
              cargo +nightly build -p sparkles --target ${{ matrix.target }} -Z build-std --features "${{ matrix.features }}"
            else
              cargo +nightly build -p sparkles --target ${{ matrix.target }} -Z build-std
            fi
          else
            # Standard cross-compilation
            if [[ -n "${{ matrix.features }}" ]]; then
              cargo build -p sparkles --target ${{ matrix.target }} --features "${{ matrix.features }}"
            else
              cargo build -p sparkles --target ${{ matrix.target }}
            fi
          fi
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

  # Original build job for binaries
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        BUILD_TARGET: [release] # refers to a cargo profile
    outputs:
      release_built: ${{ steps.set-output.outputs.release_built }}
    steps:
      - uses: actions/checkout@v4
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Build binaries in "${{ matrix.BUILD_TARGET }}" mode
        run: cargo build --profile ${{ matrix.BUILD_TARGET }} --features bin-deps